name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Check types (source)
      run: npx tsc --noEmit

    - name: Check types (tests)
      run: npx tsc --noEmit --ignoreConfig test/*.test.ts test/helpers/*.ts src/domains/scheduling/index.ts --moduleResolution nodenext --module nodenext --target es2022 --types bun-types --strict --exactOptionalPropertyTypes --noUncheckedIndexedAccess --verbatimModuleSyntax --skipLibCheck

    - name: Run tests
      run: bun test

    - name: Build
      run: bun run build
