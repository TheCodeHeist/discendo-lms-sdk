name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Standard Typecheck
        run: node_modules/.bin/tsc --noEmit

      - name: Strict Test Typecheck
        run: node_modules/.bin/tsc --noEmit --ignoreConfig test/*.test.ts test/helpers/*.ts src/domains/scheduling/index.ts --moduleResolution nodenext --module nodenext --target es2022 --types bun-types --strict --exactOptionalPropertyTypes --noUncheckedIndexedAccess --verbatimModuleSyntax --skipLibCheck

      - name: Run Tests
        run: bun test

      - name: Build Distribution
        run: bun run build
